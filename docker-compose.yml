services:
  # Production service with nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumabuild-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
